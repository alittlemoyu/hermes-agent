name: openviking
version: 2.0.0
description: "OpenViking context database — session-managed memory with automatic extraction, tiered retrieval, and filesystem-style knowledge browsing."
pip_dependencies:
  - httpx
requires_env:
  - OPENVIKING_ENDPOINT
hooks:
  - queue_prefetch
  - sync_turn
  - on_pre_compress
  - on_session_end
  - on_session_switch
